[package]
name = "duchamp-essential-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "duchamp_essential_backend"
path = "src/lib.rs"

[[bin]]
name = "duchamp_daemon"
path = "src/bin/duchamp_essentiald.rs"

[[bin]]
name = "duchamp_ctl"
path = "src/bin/duchamp_essentialctl.rs"
