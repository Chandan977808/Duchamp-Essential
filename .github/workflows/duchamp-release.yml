name: duchamp-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      DEPOT_TOOLS: ${{ github.workspace }}/depot_tools
      FLUTTER_SDK: ${{ github.workspace }}/flutter-sdk
      FLUTTER_VERSION: "3.47.7"

    steps:
      - name: Checkout (duchamp branch)
        uses: actions/checkout@v4

      - name: Free disk space for the engine checkout
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules /opt/az || true
          df -h /

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config curl unzip zip \
            python3 openjdk-17-jdk git
          java -version 2>&1 | head -1

      - name: Clone pinned Flutter SDK (own copy on local disk)
        run: |
          rm -rf "$FLUTTER_SDK"
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$FLUTTER_SDK"
          echo "$FLUTTER_SDK/bin" >> "$GITHUB_PATH"
          export PATH="$FLUTTER_SDK/bin:$PATH"
          flutter --version

      - name: Prefer our Flutter SDK on PATH
        run: echo "${{ env.FLUTTER_SDK }}/bin" >> "$GITHUB_PATH"

      - name: Stability probe (SDK must not drift)
        run: |
          export PATH="$FLUTTER_SDK/bin:$PATH"
          A="$(tr -d '[:space:]' <"$FLUTTER_SDK/bin/internal/engine.version")"
          flutter --version >/dev/null
          B="$(tr -d '[:space:]' <"$FLUTTER_SDK/bin/internal/engine.version")"
          flutter precache >/dev/null 2>&1 || true
          C="$(tr -d '[:space:]' <"$FLUTTER_SDK/bin/internal/engine.version")"
          echo "reads: $A $B $C"
          [ "$A" = "$B" ] && [ "$B" = "$C" ] || {
            echo "Flutter SDK drifts on its own; refusing to build." >&2
            exit 1
          }
          echo "engine_rev=$C" >> "$GITHUB_OUTPUT"
        id: flutter

      - name: Set up Rust with the Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up depot_tools (gclient)
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS"
          echo "$DEPOT_TOOLS" >> "$GITHUB_PATH"

      - name: Restore engine checkout cache
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_SDK }}/engine/src
          key: engine-src-v5-${{ steps.flutter.outputs.engine_rev }}

      - name: Sync Flutter engine sources
        if: steps.engine-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.FLUTTER_SDK }}
        run: |
          cp engine/scripts/standard.gclient .gclient
          for i in 1 2 3; do
            gclient sync && break
            echo "gclient sync attempt $i failed, retrying..."
            sleep 15
          done

      - name: Refresh engine sources on cache hit
        if: steps.engine-cache.outputs.cache-hit == 'true'
        working-directory: ${{ env.FLUTTER_SDK }}
        run: gclient sync

      - name: Flutter dependencies
        run: |
          export PATH="$FLUTTER_SDK/bin:$PATH"
          flutter pub get --directory "$GITHUB_WORKSPACE/ui/flutter"

      - name: Build pinned Flutter engine
        working-directory: ${{ env.FLUTTER_SDK }}
        run: |
          export PATH="$FLUTTER_SDK/bin:$PATH"
          DUCHAMP_FLUTTER_ENGINE_SRC="$FLUTTER_SDK/engine/src" \
            "$GITHUB_WORKSPACE/tools/build-flutter-engine.sh"

      - name: Top up Android SDK (platform 36, build-tools, NDK r27+)
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"
          BUILD_TOOLS="$("$SDKMANAGER" --list 2>/dev/null | grep -o 'build-tools;[0-9.]*' | sort -V | tail -1)"
          echo "Installing $BUILD_TOOLS"
          "$SDKMANAGER" "$BUILD_TOOLS"
          NDK_VER="$("$SDKMANAGER" --list 2>/dev/null | grep -o 'ndk;27\.[0-9.]*' | sort -V | tail -1)"
          echo "Installing $NDK_VER"
          "$SDKMANAGER" "$NDK_VER"

      - name: Gate (repo contract tests)
        run: |
          export PATH="$FLUTTER_SDK/bin:$PATH"
          rustup target add aarch64-linux-android
          cargo test -p duchamp-essential-daemon
          ./tools/test-root-module-contract.sh
          ./tools/test-aosp-integration.sh
          ./tools/test-release-sync.sh

      - name: Prepare signing key
        id: signing
        run: |
          if [ -n "${{ secrets.DUCHAMP_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DUCHAMP_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Using maintainer release key from secrets."
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/ci-dev.jks" -alias duchamp-essential \
              -keyalg RSA -keysize 4096 -validity 9125 -storepass android -keypass android \
              -dname "CN=Duchamp Essential CI,O=Duchamp Essential,C=US"
            echo "keystore=$RUNNER_TEMP/ci-dev.jks" >> "$GITHUB_OUTPUT"
            echo "No DUCHAMP_KEYSTORE_BASE64 secret: using an ephemeral CI key (NOT update-compatible)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build root module (KernelSU Next / Magisk)
        env:
          DUCHAMP_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          DUCHAMP_ALLOW_ANY_CERT: ${{ secrets.DUCHAMP_KEYSTORE_BASE64 == '' && '1' || '' }}
          DUCHAMP_KEY_ALIAS: ${{ secrets.DUCHAMP_KEY_ALIAS != '' && secrets.DUCHAMP_KEY_ALIAS || 'duchamp-essential' }}
          DUCHAMP_KEYSTORE_PASS: ${{ secrets.DUCHAMP_KEYSTORE_PASS != '' && secrets.DUCHAMP_KEYSTORE_PASS || 'android' }}
          DUCHAMP_KEY_PASS: ${{ secrets.DUCHAMP_KEY_PASS != '' && secrets.DUCHAMP_KEY_PASS || 'android' }}
        run: ./tools/build-kernelsu-next-module.sh

      - name: Build AOSP integration bundle
        env:
          DUCHAMP_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          DUCHAMP_KEY_ALIAS: ${{ secrets.DUCHAMP_KEY_ALIAS != '' && secrets.DUCHAMP_KEY_ALIAS || 'duchamp-essential' }}
          DUCHAMP_KEYSTORE_PASS: ${{ secrets.DUCHAMP_KEYSTORE_PASS != '' && secrets.DUCHAMP_KEYSTORE_PASS || 'android' }}
          DUCHAMP_KEY_PASS: ${{ secrets.DUCHAMP_KEY_PASS != '' && secrets.DUCHAMP_KEY_PASS || 'android' }}
        run: |
          ./tools/export-aosp-bundle.sh "$RUNNER_TEMP/aosp-bundle"
          tar -czf "$RUNNER_TEMP/DuchampEssential-AOSP-bundle.tar.gz" -C "$RUNNER_TEMP/aosp-bundle" .

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Duchamp Essential $TAG" \
            --notes "Duchamp Essential $TAG for duchamp (POCO X6 Pro / Redmi K70E). SaanOS port of Rodin Essential."
          gh release upload "$TAG" out/kernelsu-next/*/*.zip \
            "$RUNNER_TEMP/DuchampEssential-AOSP-bundle.tar.gz" --clobber

      - name: Upload module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Duchamp-Essential-KernelSU-Next-Magisk
          path: out/kernelsu-next/*/*.zip

      - name: Upload AOSP integration bundle
        uses: actions/upload-artifact@v4
        with:
          name: DuchampEssential-AOSP-bundle
          path: ${{ runner.temp }}/DuchampEssential-AOSP-bundle.tar.gz
